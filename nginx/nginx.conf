limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

upstream api_upstream { server api:4000; keepalive 32; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # API reverse proxy (X-Request-Id propagated for log correlation)
  location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 15s;
  }

  # Internal endpoints are never public
  location /metrics { return 404; }
  location /internal/ { return 404; }

  # Static assets: long cache for hashed files, SPA fallback for routes
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
