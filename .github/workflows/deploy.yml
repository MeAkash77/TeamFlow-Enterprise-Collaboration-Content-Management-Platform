name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: { contents: read, packages: write }

jobs:
  build-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/${{ github.repository_owner }}/teamflow
      TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: Build & push images
        run: |
          docker buildx build --push -t $PREFIX-api:$TAG ./backend
          docker buildx build --push -t $PREFIX-audit:$TAG ./audit-service
          docker buildx build --push -t $PREFIX-gateway:$TAG -f nginx/Dockerfile .

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to AWS EC2 (auto-rollback on failed health check)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/teamflow
            git pull --ff-only
            ./scripts/deploy.sh ${{ github.event.workflow_run.head_sha }}
